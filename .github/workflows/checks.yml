name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py test routing --verbosity 2
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build and start Docker services
        shell: pwsh
        run: ./start.ps1 -Rebuild
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-in-production-spotter
      - name: Verify Nginx and Django integration
        run: python scripts/smoke-docker.py
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-in-production-spotter
      - name: Stop Docker services
        if: always()
        run: docker compose down
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-in-production-spotter
