name: spotter
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      ORS_API_KEY: ${ORS_API_KEY:-}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      WEATHER_URL: ${WEATHER_URL:-https://api.open-meteo.com/v1/forecast}
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
